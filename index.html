<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UK Weather Map</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>UK Weather Map</h1>
      <label>
        Vertical exaggeration
        <input id="exaggeration" type="range" min="1" max="10" step="0.5" value="4" />
        <output id="exaggeration-value">4×</output>
      </label>
      <p class="hint">Drag to pan, right-drag to rotate, scroll to zoom.</p>
    </div>
    <div id="loading">Loading terrain…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

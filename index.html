<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UK Weather Map</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <h1>UK Weather Map</h1>
      <label>
        Vertical exaggeration
        <input id="exaggeration" type="range" min="1" max="10" step="0.5" value="4" />
        <output id="exaggeration-value">4×</output>
      </label>
      <label title="Eases the relief towards 1.5× as the camera gets low, so hills look their real shape from the ground">
        <input id="relief-easing" type="checkbox" checked />
        Real relief near the ground
      </label>
      <label title="Plymouth and Kielder as they were before lidar building heights and Forest Inventory / habitat land cover (reloads the page)">
        <input id="terrain-before" type="checkbox" />
        Old terrain data
      </label>
      <label>
        <input id="rain" type="checkbox" checked />
        Rain (mm/h)
      </label>
      <div class="legend">
        <span style="background: #0000fe">&lt;0.5</span><span style="background: #3265fe">0.5–1</span><span style="background: #0cbcfe">1–2</span><span style="background: #00a300">2–4</span><span style="background: #fecb00">4–8</span><span style="background: #fe9800">8–16</span><span style="background: #fe0000">16–32</span><span style="background: #b30000">&gt;32</span>
      </div>
      <p id="rain-info" class="hint"></p>
      <p id="camera-hint" class="hint">Drag to pan, right-drag to rotate, scroll to zoom.</p>
    </div>
    <div id="loading">Loading terrain…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
